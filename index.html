<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavalier King Charles Spaniel</title>

    <style>
        body {
            margin: 0;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .image-wrapper {
            display: inline-block;
        }

        img {
            width: 300px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            user-select: none;
        }

        .memorial-text {
            margin: 20px 0 0;
            color: #333;
            font-size: 1.15rem;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="image-wrapper">
            <img src="assets/ckcs_sad.png" alt="Pixel Art Cavalier King Charles Spaniel">
        </div>
        <p class="memorial-text">In loving memory of Benji</p>
    </div>


</body>

</html>
